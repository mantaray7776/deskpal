[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.partitions = partitions_sampler.csv
board_build.filesystem = littlefs
; PSRAM holds the capture buffer (up to a few seconds of 16-bit PCM @16kHz)
; so recordings don't eat into the small internal SRAM budget.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    links2004/WebSockets @ ^2.4.1
